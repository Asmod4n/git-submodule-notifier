# Opens an issue when a submodule is behind upstream: a newer stable tag
# for a tag pin, a newer head of the default branch for a commit pin.
# Never moves a pin. See README.md for the caller snippet.
name: deps upstream (reusable)

on:
  workflow_call:
    inputs:
      notify:
        description: 'Who to @-mention so GitHub sends mail, e.g. @octocat'
        required: false
        type: string
        default: ''
      label_prefix:
        description: 'Label namespace for the tracking issues'
        required: false
        type: string
        default: 'deps'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Two racing runs would both find no issue and both create one.
    concurrency:
      group: deps-upstream-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check every submodule against its own upstream
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ inputs.notify }}
          LABEL_PREFIX: ${{ inputs.label_prefix }}
        run: |
          set -euo pipefail

          if [ ! -f .gitmodules ]; then
            echo "no .gitmodules - nothing to watch"
            exit 0
          fi

          # git config, not grep: .gitmodules allows continuations and quoting.
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.$name.url" || true)"
            label="$LABEL_PREFIX: $(basename "$path")"

            if [ -z "$url" ] || [ ! -d "$path/.git" ] && [ ! -f "$path/.git" ]; then
              echo "$path: not checked out, skipping"
              continue
            fi

            # A branch-pinned submodule already moves; nothing to report.
            if git config -f .gitmodules --get "submodule.$name.branch" >/dev/null; then
              echo "$path: follows a branch, skipping"
              continue
            fi

            pinned="$(git -C "$path" describe --tags --exact-match HEAD 2>/dev/null || true)"
            if [ -z "$pinned" ]; then
              # Pinned to a commit: compare it with the head of the default branch.
              commit="$(git -C "$path" rev-parse HEAD)"
              head="$(git ls-remote "$url" HEAD 2>/dev/null | awk '{print $1}' || true)"
              if [ -z "$head" ]; then
                echo "$path: upstream HEAD not readable, skipping"
                continue
              fi

              gh label create "$label" \
                --description "Automated: $(basename "$path") upstream tracking" \
                --color 0e8a16 >/dev/null 2>&1 || true

              existing="$(gh issue list --label "$label" --state open --limit 1 \
                          --json number --jq '.[0].number // empty')"

              if [ "$commit" = "$head" ]; then
                if [ -n "$existing" ]; then
                  gh issue close "$existing" \
                    --comment "\`$path\` is pinned at \`${commit:0:7}\`, the head of upstream. Closing."
                fi
                echo "$path: ${commit:0:7} is the upstream head"
                continue
              fi

              # The submodule may be a shallow clone; fetch upstream HEAD to count.
              git -C "$path" fetch --quiet "$url" HEAD 2>/dev/null || true
              if git -C "$path" merge-base --is-ancestor "$commit" "$head" 2>/dev/null; then
                behind="$(git -C "$path" rev-list --count "$commit..$head")"
                state="$behind commits behind"
                log="$(git -C "$path" log --oneline --no-decorate "$commit..$head" | head -n 20)"
              else
                state="not an ancestor of the upstream head"
                log=""
              fi

              title="$(basename "$path") upstream moved (pinned: ${commit:0:7})"
              body=$(cat <<EOF
          ${NOTIFY}

          \`$path\` is pinned at commit **${commit:0:7}**. The head of upstream
          is **${head:0:7}**: the pin is $state.

          \`\`\`
          $log
          \`\`\`

          Opened by \`deps-upstream\`. One issue per submodule, edited in
          place as upstream moves, closed once the pin reaches the head.
          **Nothing here has been changed.**

          - Read the commits for **security fixes** first.
          - Bump: \`git -C $path fetch origin && git -C $path checkout ${head:0:7}\`,
            then commit the submodule pointer.
          EOF
          )

              if [ -n "$existing" ]; then
                gh issue edit "$existing" --title "$title" --body "$body"
                echo "$path: updated issue #$existing"
              else
                gh issue create --title "$title" --body "$body" --label "$label" \
                  --assignee "${NOTIFY#@}" >/dev/null 2>&1 \
                  || gh issue create --title "$title" --body "$body" --label "$label"
                echo "$path: opened an issue for ${head:0:7}"
              fi
              continue
            fi

            # Stable tags only; a leading v is tolerated and compared without.
            latest="$(git ls-remote --tags --refs "$url" 2>/dev/null \
                      | awk -F/ '{print $NF}' \
                      | grep -E '^v?[0-9]+(\.[0-9]+)+$' \
                      | sed 's/^v//' | sort -V | tail -1 || true)"
            if [ -z "$latest" ]; then
              echo "$path: no comparable tags upstream, skipping"
              continue
            fi

            gh label create "$label" \
              --description "Automated: $(basename "$path") release tracking" \
              --color 0e8a16 >/dev/null 2>&1 || true

            existing="$(gh issue list --label "$label" --state open --limit 1 \
                        --json number --jq '.[0].number // empty')"

            bare="${pinned#v}"
            newest="$(printf '%s\n%s\n' "$bare" "$latest" | sort -V | tail -1)"
            if [ "$bare" = "$latest" ] || [ "$newest" = "$bare" ]; then
              if [ -n "$existing" ]; then
                gh issue close "$existing" \
                  --comment "\`$path\` is pinned at \`$pinned\`, which is current. Closing."
              fi
              echo "$path: $pinned is current"
              continue
            fi

            title="$(basename "$path") $latest is out (pinned: $pinned)"
            body=$(cat <<EOF
          ${NOTIFY}

          \`$path\` is pinned at **$pinned**. Upstream's latest stable tag is
          **$latest**.

          Opened by \`deps-upstream\`. One issue per submodule, edited in
          place as further releases appear, closed once the pin moves.
          **Nothing here has been changed.**

          - Read the release notes for **security fixes** first.
          - Bump: \`git -C $path fetch --tags && git -C $path checkout $latest\`,
            then commit the submodule pointer.
          EOF
          )

            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title" --body "$body"
              echo "$path: updated issue #$existing"
            else
              # Assignment fails silently on some repos; the mention does not.
              gh issue create --title "$title" --body "$body" --label "$label" \
                --assignee "${NOTIFY#@}" >/dev/null 2>&1 \
                || gh issue create --title "$title" --body "$body" --label "$label"
              echo "$path: opened an issue for $latest"
            fi
          done
